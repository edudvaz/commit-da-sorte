<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Commit da Sorte</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>Commit da Sorte</h1>

        <nav>

            <a href="#cadastro">Cadastrar</a>
            <a href="#lista">Participantes</a>
            <a href="#resultado">Resultado</a>

        </nav>

    </header>

    <main>

        <section class="banner">

            <h2>Realize sorteios de forma rápida e simples</h2>

            <p>
                Cadastre participantes e descubra o vencedor com apenas um clique.
            </p>

            <button onclick="document.getElementById('cadastro').scrollIntoView({behavior:'smooth'})">
                Começar
            </button>

        </section>

        <section id="cadastro">

            <h2>Cadastrar Participante</h2>

            <form id="formParticipante">

                <label>Nome</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome">

                <label>Número da Rifa</label>
                <input
                    type="number"
                    id="numero"
                    placeholder="Digite o número">

                <button type="submit">
                    Adicionar Participante
                </button>

            </form>

        </section>

        <section id="lista">

            <h2>Participantes</h2>

            <table>

                <thead>

                    <tr>

                        <th>Nome</th>
                        <th>Número</th>

                    </tr>

                </thead>

                <tbody id="tabelaParticipantes">

                </tbody>

            </table>

        </section>

        <section id="resultado">

            <h2>Resultado do Sorteio</h2>

            <div class="resultado">

                <h3>Vencedor</h3>

                <p id="vencedor">
                    Nenhum sorteio realizado.
                </p>

                <button id="sortear">
                    Sortear Agora
                </button>

            </div>

        </section>

    </main>

    <footer>

        <p>
            © 2026>Commit da Sorte
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
